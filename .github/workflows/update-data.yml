name: Update market data

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch public data
        run: |
          python -m scripts.ingest.fetch_cboe
          python -m scripts.ingest.fetch_fred_csv

      - name: Transform and score data
        run: |
          python -m scripts.transform.normalize_series
          python -m scripts.transform.compute_percentiles
          python -m scripts.transform.compute_regime_score

      - name: Validate data
        run: |
          python -m scripts.validate.validate_schema
          python -m scripts.validate.validate_freshness

      - name: Commit data updates
        run: |
          if git diff --quiet -- public/data; then
            echo "No public data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore: update market data"
          git push
